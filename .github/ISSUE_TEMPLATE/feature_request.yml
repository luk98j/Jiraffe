name: Feature request
description: Suggest an idea or an improvement.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem would this solve, or what are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that helps explain the request.
    validations:
      required: false
